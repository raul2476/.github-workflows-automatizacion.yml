name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del servidor y del agente
        run: |
          node --check src/server.js
          node --check src/agent.js
          node --check src/twilioClient.js
          node --check scripts/send-test-message.js

      - name: Cargar la app (sin arrancar el puerto)
        run: node -e "require('./src/server.js'); console.log('OK: la app carga correctamente')"
